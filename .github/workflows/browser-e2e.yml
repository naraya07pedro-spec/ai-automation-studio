name: Real browser smoke tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium-five-workflows:
    name: Chromium UI acceptance (5 synthetic workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise actual UI in headless Chromium
        run: python -m unittest discover -s tests_browser -v
      - name: Store synthetic browser screenshots for visual review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-ui-chromium-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
