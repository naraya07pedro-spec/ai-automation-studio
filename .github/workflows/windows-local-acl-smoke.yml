name: Windows local ACL diagnostic verification

on:
  pull_request:
    paths:
      - ".github/workflows/windows-local-acl-smoke.yml"
      - "scripts/check_windows_local_acl.ps1"
      - "docs/LOCAL_SECURITY_DURABILITY_AUDIT_V1.md"
      - "docs/PROGRESS.md"
      - "app/local_plan_artifacts.py"
      - "app/local_server.py"
      - "tests/test_local_plan_artifacts.py"
      - "docs/LOCAL_PLAN_ARTIFACT_EXPORT_V1.md"
      - "app/local_csv_profile.py"
      - "app/local_agent_task_plans.py"
      - "tests/test_local_agent_csv_profile.py"
      - "app/local_agent_handoffs.py"
      - "tests/test_local_agent_csv_handoffs.py"
      - "docs/CSV_TYPED_HANDOFFS_V1.md"
      - "app/local_tool_registry.py"
      - "app/local_tool_action_gate.py"
      - "app/local_security_audit.py"
      - "tests/test_local_tool_actions.py"
      - "docs/LOCAL_TOOL_ACTION_GATE_V1.md"
      - "app/local_hn_story_policy.py"
      - "app/local_hn_story_reader.py"
      - "tests/test_local_hn_story_connector.py"
      - "docs/HN_PUBLIC_STORY_CONNECTOR_V1.md"
      - "app/local_hn_job_discovery.py"
      - "tests/test_local_hn_job_discovery.py"
      - "docs/HN_JOB_DISCOVERY_V1.md"
      - "app/local_greenhouse_job_evidence.py"
      - "tests/test_local_greenhouse_job_evidence.py"
      - "app/local_remote_job_eligibility.py"
      - "tests/test_local_remote_job_eligibility.py"
      - "docs/REMOTE_JOB_ELIGIBILITY_EVIDENCE_V1.md"
      - "docs/GREENHOUSE_PUBLIC_ATS_EVIDENCE_V1.md"
      - "docs/OWNER_SELECTED_CSV_PROFILE_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-acl-readonly-smoke:
    name: PowerShell ACL diagnostic on disposable Windows files
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Missing operator directory is INCOMPLETE, never secure
        shell: pwsh
        run: |
          # Nonzero status is the EXPECTED diagnostic result, not a job crash.
          $PSNativeCommandUseErrorActionPreference = $false
          $missing = Join-Path $env:RUNNER_TEMP "aas_missing_${{ github.run_id }}"
          $result = Start-Process -FilePath "pwsh" -ArgumentList @(
            "-NoProfile", "-File", ".\scripts\check_windows_local_acl.ps1",
            "-Root", $missing
          ) -Wait -PassThru -NoNewWindow
          if ($result.ExitCode -ne 3) {
            throw "Expected INCOMPLETE exit 3 for nonexistent folder; got $($result.ExitCode)"
          }
      - name: Broad Everyone permission on test file is detected
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $fixture = Join-Path $env:RUNNER_TEMP "aas_acl_fixture_${{ github.run_id }}"
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          $file = Join-Path $fixture "operator.json"
          Set-Content -LiteralPath $file -Value '{"synthetic":true}' -Encoding utf8
          $acl = Get-Acl -LiteralPath $file
          $everyone = [System.Security.Principal.SecurityIdentifier]::new("S-1-1-0")
          $rule = [System.Security.AccessControl.FileSystemAccessRule]::new(
            $everyone,
            [System.Security.AccessControl.FileSystemRights]::Read,
            [System.Security.AccessControl.AccessControlType]::Allow
          )
          $acl.AddAccessRule($rule)
          Set-Acl -LiteralPath $file -AclObject $acl
          $result = Start-Process -FilePath "pwsh" -ArgumentList @(
            "-NoProfile", "-File", ".\scripts\check_windows_local_acl.ps1",
            "-Root", $fixture
          ) -Wait -PassThru -NoNewWindow
          if ($result.ExitCode -ne 2) {
            throw "Expected RISK exit 2 on synthetic broad ACL; got $($result.ExitCode)"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Owner-artifact export contract on disposable Windows directory
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_local_plan_artifacts.py -v
      - name: Bounded owner-selected CSV profile contract on synthetic Windows data
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_local_agent_csv_profile.py -v
      - name: Verified CSV count and sum handoffs on disposable Windows storage
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_local_agent_csv_handoffs.py -v
      - name: Two-phase owner action and tool registry on disposable Windows files
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_local_tool_actions.py -v
      - name: Owner-granted HN connector tests on disposable Windows environment
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_local_hn_story_connector.py -v
      - name: Owner-clicked HN job preview tests on disposable Windows files
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_local_hn_job_discovery.py -v
      - name: Official Greenhouse ATS public job evidence on disposable Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_local_greenhouse_job_evidence.py -v
      - name: Evidence-only remote job eligibility triage on disposable Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_local_remote_job_eligibility.py -v
      - name: Scope and cleanup
        shell: pwsh
        run: |
          Write-Output "No real user files were inspected or modified."
          Write-Output "This verifies runtime diagnostics, NOT security of the user's PC."
