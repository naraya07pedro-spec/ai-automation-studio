name: Stage 129 owner-reviewed Agent delegation

on:
  pull_request:
    paths:
      - 'app/local_agent_delegation.py'
      - 'app/local_durable_plan_queue.py'
      - 'tests/test_agent_delegation.py'
      - 'docs/AGENT_DELEGATION_V1.md'
      - '.github/workflows/agent-delegation.yml'
  push:
    branches: [main]
    paths:
      - 'app/local_agent_delegation.py'
      - 'app/local_durable_plan_queue.py'
      - 'tests/test_agent_delegation.py'
      - 'docs/AGENT_DELEGATION_V1.md'
      - '.github/workflows/agent-delegation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delegation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile modules and exact tests
        run: python -m py_compile app/local_agent_delegation.py app/local_durable_plan_queue.py app/local_agent_task_plans.py tests/test_agent_delegation.py
      - name: Two-Agent authorization, revocation, HTTP and restart
        run: python -m unittest discover -s tests -p 'test_agent_delegation.py' -v
      - name: Original DAG queue and Agent/memory permissions regression
        run: |
          python -m unittest discover -s tests -p 'test_durable_plan_queue.py' -v
          python -m unittest discover -s tests -p 'test_agent_profiles.py' -v
          python -m unittest discover -s tests -p 'test_scoped_agent_memory.py' -v
          python -m unittest discover -s tests -p 'test_local_agent_task_plans.py' -v
