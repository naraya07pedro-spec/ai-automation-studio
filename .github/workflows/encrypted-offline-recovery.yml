name: Stage 111 encrypted offline owner recovery

on:
  pull_request:
    paths:
      - 'tools/backup_local_state.py'
      - 'tests/test_encrypted_offline_backup.py'
      - 'docs/LOCAL_ENCRYPTED_BACKUP_RECOVERY_V1.md'
      - '.github/workflows/encrypted-offline-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'tools/backup_local_state.py'
      - 'tests/test_encrypted_offline_backup.py'
      - 'docs/LOCAL_ENCRYPTED_BACKUP_RECOVERY_V1.md'
      - '.github/workflows/encrypted-offline-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-disposable-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned official AES-GCM implementation
        run: python -m pip install -r requirements-vault.txt
      - name: Cryptographic and filesystem negative-path acceptance
        run: python -m unittest discover -s tests -p 'test_encrypted_offline_backup.py' -v
      - name: Compile without user-state access
        run: python -m py_compile tools/backup_local_state.py
