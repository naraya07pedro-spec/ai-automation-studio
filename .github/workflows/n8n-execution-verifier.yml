name: Stage 117 official n8n read-only execution verifier

on:
  pull_request:
    paths:
      - 'app/local_n8n_execution_verifier.py'
      - 'app/local_server.py'
      - 'app/local_security_audit.py'
      - 'web/handoff.html'
      - 'tests/test_n8n_execution_verifier.py'
      - 'docs/N8N_READONLY_EXECUTION_VERIFY_V1.md'
      - '.github/workflows/n8n-execution-verifier.yml'
  push:
    branches: [main]
    paths:
      - 'app/local_n8n_execution_verifier.py'
      - 'app/local_server.py'
      - 'app/local_security_audit.py'
      - 'web/handoff.html'
      - 'tests/test_n8n_execution_verifier.py'
      - 'docs/N8N_READONLY_EXECUTION_VERIFY_V1.md'
      - '.github/workflows/n8n-execution-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-scoped-execution-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional pinned AES-GCM dependency (no focused skips)
        run: python -m pip install -r requirements-vault.txt
      - name: Owner-authenticated exact n8n GET and delivery correlation acceptance
        run: python -m unittest discover -s tests -p 'test_n8n_execution_verifier.py' -v
      - name: Stage 116 signed evidence, Stage 114 handoff and Stage 115 queue regressions
        run: |
          python -m unittest discover -s tests -p 'test_signed_manual_handoff_outcome.py' -v
          python -m unittest discover -s tests -p 'test_agent_connector_handoff.py' -v
          python -m unittest discover -s tests -p 'test_durable_plan_queue.py' -v
          python -m unittest discover -s tests -p 'test_n8n_delivery_proof.py' -v
      - name: Python syntax checks
        run: python -m py_compile app/local_n8n_execution_verifier.py app/local_server.py app/local_security_audit.py tests/test_n8n_execution_verifier.py
      - name: Browser JS syntax
        run: |
          node -e 'const fs=require("fs");for(const p of ["web/handoff.html","web/mission.html","web/jobs.html"]){const s=fs.readFileSync(p,"utf8"),m=s.split("<script>")[1]?.split("</script>")[0];if(!m)throw Error(p+" script missing");new Function(m)}'
