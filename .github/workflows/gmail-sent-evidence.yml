name: Stage 120 independent Gmail SENT evidence contract

on:
  pull_request:
    paths:
      - 'app/local_gmail_sent_evidence.py'
      - 'app/local_google_gmail.py'
      - 'app/local_server.py'
      - 'app/local_security_audit.py'
      - 'tools/owner_gmail_sent_acceptance.py'
      - 'tools/owner_live_n8n_acceptance.py'
      - 'tests/test_gmail_sent_evidence.py'
      - 'docs/GMAIL_SENT_ARTIFACT_EVIDENCE_V1.md'
      - '.github/workflows/gmail-sent-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'app/local_gmail_sent_evidence.py'
      - 'app/local_google_gmail.py'
      - 'app/local_server.py'
      - 'app/local_security_audit.py'
      - 'tools/owner_gmail_sent_acceptance.py'
      - 'tools/owner_live_n8n_acceptance.py'
      - 'tests/test_gmail_sent_evidence.py'
      - 'docs/GMAIL_SENT_ARTIFACT_EVIDENCE_V1.md'
      - '.github/workflows/gmail-sent-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-120-gmail-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned optional encryption dependency
        run: python -m pip install -r requirements-vault.txt
      - name: Test one-shot sent metadata, evidence chain, restart, privacy, negative cases
        run: python -m unittest discover -s tests -p 'test_gmail_sent_evidence.py' -v
      - name: Test existing Gmail, n8n, and owner-cli regressions
        run: |
          python -m unittest discover -s tests -p 'test_google_gmail_metadata.py' -v
          python -m unittest discover -s tests -p 'test_n8n_execution_verifier.py' -v
          python -m unittest discover -s tests -p 'test_owner_live_n8n_acceptance.py' -v
      - name: Strict module and tools syntax
        run: python -m py_compile app/local_gmail_sent_evidence.py app/local_google_gmail.py app/local_server.py app/local_security_audit.py tools/owner_gmail_sent_acceptance.py tools/owner_live_n8n_acceptance.py tests/test_gmail_sent_evidence.py
