name: Stage 116 signed manual handoff outcome evidence

on:
  pull_request:
    paths:
      - 'app/local_handoff_outcome_proof.py'
      - 'app/local_server.py'
      - 'app/local_security_audit.py'
      - 'app/local_agent_connector_handoff.py'
      - 'app/local_connector_manager.py'
      - 'web/handoff.html'
      - 'tests/test_signed_manual_handoff_outcome.py'
      - 'docs/SIGNED_MANUAL_HANDOFF_OUTCOME_V1.md'
      - '.github/workflows/signed-handoff-outcome.yml'
  push:
    branches: [main]
    paths:
      - 'app/local_handoff_outcome_proof.py'
      - 'app/local_server.py'
      - 'app/local_security_audit.py'
      - 'app/local_agent_connector_handoff.py'
      - 'app/local_connector_manager.py'
      - 'web/handoff.html'
      - 'tests/test_signed_manual_handoff_outcome.py'
      - 'docs/SIGNED_MANUAL_HANDOFF_OUTCOME_V1.md'
      - '.github/workflows/signed-handoff-outcome.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcome-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned AES-GCM dependency (must NOT skip focused tests)
        run: python -m pip install -r requirements-vault.txt
      - name: Signed manual outcome acceptance (real local DB, fake HTTPS sender)
        run: python -m unittest discover -s tests -p 'test_signed_manual_handoff_outcome.py' -v
      - name: Regress existing manual and scheduled signed n8n evidence
        run: |
          python -m unittest discover -s tests -p 'test_agent_connector_handoff.py' -v
          python -m unittest discover -s tests -p 'test_n8n_delivery_proof.py' -v
          python -m unittest discover -s tests -p 'test_encrypted_connector_vault.py' -v
          python -m unittest discover -s tests -p 'test_local_connector_manager.py' -v
          python -m unittest discover -s tests -p 'test_outbound_webhook.py' -v
      - name: Python syntax
        run: python -m py_compile app/local_handoff_outcome_proof.py app/local_server.py app/local_security_audit.py tests/test_signed_manual_handoff_outcome.py
      - name: Private operator JS syntax
        run: |
          node -e 'const fs=require("fs");for(const p of ["web/handoff.html","web/mission.html"]){const s=fs.readFileSync(p,"utf8"),m=s.split("<script>")[1]?.split("</script>")[0];if(!m)throw Error(p+" no script");new Function(m)}'
