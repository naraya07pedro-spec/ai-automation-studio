name: Private VPS credential-backed service and live-proof contract

on:
  pull_request:
    paths:
      - 'app/local_service_credentials.py'
      - 'app/local_server.py'
      - 'deploy/private_vps_service.py'
      - 'deploy/provision_private_vps_credential.py'
      - 'deploy/verify_private_vps_runtime.py'
      - 'tests/test_private_vps_credentials_and_probe.py'
      - 'docs/PRIVATE_VPS_CREDENTIAL_READINESS_V2.md'
      - '.github/workflows/private-vps-credential-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'app/local_service_credentials.py'
      - 'app/local_server.py'
      - 'deploy/private_vps_service.py'
      - 'deploy/provision_private_vps_credential.py'
      - 'deploy/verify_private_vps_runtime.py'
      - 'tests/test_private_vps_credentials_and_probe.py'
      - 'docs/PRIVATE_VPS_CREDENTIAL_READINESS_V2.md'
      - '.github/workflows/private-vps-credential-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-vps-operational-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production private credential and runtime proof tests
        run: python -m unittest discover -s tests -p 'test_private_vps_credentials_and_probe.py' -v
      - name: Check original VPS regression tests
        run: python -m unittest discover -s tests -p 'test_private_vps_release.py' -v
      - name: Compile all changed Python modules
        run: |
          python -m py_compile app/local_service_credentials.py app/local_server.py deploy/private_vps_service.py deploy/provision_private_vps_credential.py deploy/verify_private_vps_runtime.py
      - name: Verify opt-in secret-bearing systemd unit syntax
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tempfile
          sys.path.insert(0,'deploy')
          from private_vps_service import render_unit
          with tempfile.TemporaryDirectory() as tmp:
              for mode, choices in (
                  ('default', {}),
                  ('connected', dict(encrypted_webhooks=True, gmail_metadata=True,
                                     outbound_webhook=True, signed_webhook=True))):
                  unit=render_unit(username='runner', home='/home/runner',
                      checkout='/home/runner/ai-automation-studio',
                      python='/usr/bin/python3', mode='offline', **choices)
                  path=pathlib.Path(tmp)/('ai-automation-studio-'+mode+'.service')
                  path.write_text(unit, encoding='utf-8')
                  subprocess.run(['systemd-analyze','verify',str(path)],check=True)
              print('Both default and opt-in systemd units parsed; NOT installed')
          PY
      - name: State external limits
        run: echo "Synthetic tests only. No Tencent Cloud SSH, no Google consent, no live n8n, and no reboot check."
