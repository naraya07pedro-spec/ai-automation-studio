name: Stage 112 owner-confirmed on-demand OpenAI (no paid calls in CI)

on:
  pull_request:
    paths:
      - 'app/local_on_demand_remote_ai.py'
      - 'app/local_server.py'
      - 'app/local_security_audit.py'
      - 'web/mission.html'
      - 'tests/test_on_demand_remote_ai.py'
      - 'docs/ON_DEMAND_CLOUD_AI_V1.md'
      - '.github/workflows/on-demand-cloud-ai.yml'
  push:
    branches: [main]
    paths:
      - 'app/local_on_demand_remote_ai.py'
      - 'app/local_server.py'
      - 'app/local_security_audit.py'
      - 'web/mission.html'
      - 'tests/test_on_demand_remote_ai.py'
      - 'docs/ON_DEMAND_CLOUD_AI_V1.md'
      - '.github/workflows/on-demand-cloud-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-one-shot-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test real private HTTP with networkless provider
        run: python -m unittest discover -s tests -p 'test_on_demand_remote_ai.py' -v
      - name: Regress cloud-only, bounded API and safety invariants
        run: |
          python -m unittest discover -s tests -p 'test_cloud_only_scheduler.py' -v
          python -m unittest discover -s tests -p 'test_bounded_remote_openai_scheduler.py' -v
          python -m unittest discover -s tests -p 'test_local_model_safety.py' -v
      - name: Compile production files without using API keys
        run: python -m py_compile app/local_on_demand_remote_ai.py app/local_server.py
      - name: JavaScript source compiles
        run: |
          node -e 'const fs=require("fs"),s=fs.readFileSync("web/mission.html","utf8");const m=s.match(/<script>([\s\S]*?)<\/script>/);if(!m)process.exit(3);new Function(m[1])'
