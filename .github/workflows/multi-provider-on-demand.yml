name: Owner-approved three-provider cloud text backend

on:
  pull_request:
    paths:
      - 'app/multi_provider_readonly.py'
      - 'app/local_on_demand_remote_ai.py'
      - 'app/local_server.py'
      - 'tests/test_multi_provider_on_demand.py'
      - 'tests/test_multi_provider_cloud_plan.py'
      - 'docs/MULTI_PROVIDER_ON_DEMAND_V1.md'
      - 'docs/MULTI_PROVIDER_CLOUD_PLANS_V1.md'
      - '.github/workflows/multi-provider-on-demand.yml'
  push:
    branches: [main]
    paths:
      - 'app/multi_provider_readonly.py'
      - 'app/local_on_demand_remote_ai.py'
      - 'app/local_server.py'
      - 'tests/test_multi_provider_on_demand.py'
      - 'docs/MULTI_PROVIDER_ON_DEMAND_V1.md'
      - '.github/workflows/multi-provider-on-demand.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile adapters, ledger, HTTP server and tests
        run: python -m py_compile app/multi_provider_readonly.py app/local_on_demand_remote_ai.py app/local_server.py tests/test_multi_provider_on_demand.py
      - name: Three-provider fixed-host and owner-authenticated integration
        run: |
          python -m unittest discover -s tests -p 'test_multi_provider_on_demand.py' -v
          python -m unittest discover -s tests -p 'test_multi_provider_cloud_plan.py' -v
      - name: Existing paid OpenAI and cloud plan regressions
        run: |
          python -m unittest discover -s tests -p 'test_on_demand_remote_ai.py' -v
          python -m unittest discover -s tests -p 'test_cloud_plan_bridge.py' -v
          python -m unittest discover -s tests -p 'test_bounded_remote_openai_scheduler.py' -v
