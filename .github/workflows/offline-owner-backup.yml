name: Stage 111 offline encrypted owner state backup and recovery

on:
  pull_request:
    paths:
      - 'tools/offline_owner_backup.py'
      - 'tests/test_offline_owner_backup.py'
      - 'docs/OFFLINE_ENCRYPTED_OWNER_BACKUP_V1.md'
      - '.github/workflows/offline-owner-backup.yml'
  push:
    branches: [main]
    paths:
      - 'tools/offline_owner_backup.py'
      - 'tests/test_offline_owner_backup.py'
      - 'docs/OFFLINE_ENCRYPTED_OWNER_BACKUP_V1.md'
      - '.github/workflows/offline-owner-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned optional AES-GCM library
        run: python -m pip install -r requirements-vault.txt
      - name: Encrypted state backup, tamper denial and disposable restore
        run: python -m unittest discover -s tests -p 'test_offline_owner_backup.py' -v
      - name: Regress offline owner and local security
        run: |
          python -m unittest discover -s tests -p 'test_local_offline_recovery.py' -v
          python -m unittest discover -s tests -p 'test_cloud_only_scheduler.py' -v
          python -m unittest discover -s tests -p 'test_private_cloud_runtime_acceptance.py' -v
      - name: Syntax verification
        run: python -m py_compile tools/offline_owner_backup.py tests/test_offline_owner_backup.py

  windows-local-archive-contract:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional AES-GCM dependency
        run: python -m pip install -r requirements-vault.txt
      - name: Run create, verify, restore and fail-closed tests on Windows
        run: python -m unittest discover -s tests -p 'test_offline_owner_backup.py' -v
