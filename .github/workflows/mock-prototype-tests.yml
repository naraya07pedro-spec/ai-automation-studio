name: Mock prototype tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    name: Python ${{ matrix.python-version }} mock verification
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record mock runtime compatibility baseline
        run: |
          PYTHONPATH=prototype python -c "from lead_inquiry_runtime_contract import runtime_contract; print(runtime_contract())"
      - name: Reject pinned synthetic fixture drift
        run: python tools/check_runtime_drift.py
      - name: Report historical runtime evidence versus current fixture\n        run: python tools/report_runtime_evidence.py\n      - name: Validate synthetic fixture contract
        run: python tools/validate_fixture_contract.py
      - name: Run all standard-library tests
        run: python -m unittest discover -s tests -v
