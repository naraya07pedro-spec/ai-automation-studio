name: Mock prototype tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate synthetic fixture contract
        run: python tools/validate_fixture_contract.py
      - name: Run all standard-library tests
        run: python -m unittest discover -s tests -v
