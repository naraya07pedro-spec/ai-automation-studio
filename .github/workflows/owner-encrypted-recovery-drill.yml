name: Stage 123 two-copy encrypted owner recovery drill

on:
  pull_request:
    paths:
      - 'tools/owner_encrypted_recovery_drill.py'
      - 'tests/test_owner_encrypted_recovery_drill.py'
      - 'docs/TWO_COPY_ENCRYPTED_OWNER_RECOVERY_DRILL_V1.md'
      - '.github/workflows/owner-encrypted-recovery-drill.yml'
      - 'tools/offline_owner_backup.py'
      - 'tools/owner_acceptance_audit.py'
  push:
    branches: [main]
    paths:
      - 'tools/owner_encrypted_recovery_drill.py'
      - 'tests/test_owner_encrypted_recovery_drill.py'
      - 'docs/TWO_COPY_ENCRYPTED_OWNER_RECOVERY_DRILL_V1.md'
      - '.github/workflows/owner-encrypted-recovery-drill.yml'
      - 'tools/offline_owner_backup.py'
      - 'tools/owner_acceptance_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-owner-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned optional AES-GCM dependency
        run: python -m pip install -r requirements-vault.txt
      - name: Stage123 real sealed two-copy SQLite and six-ledger tests
        run: python -m unittest discover -s tests -p 'test_owner_encrypted_recovery_drill.py' -v
      - name: Existing Stage111 encrypted backup and Stage118 owner chain regression
        run: |
          python -m unittest discover -s tests -p 'test_offline_owner_backup.py' -v
          python -m unittest discover -s tests -p 'test_owner_acceptance_audit.py' -v
      - name: Strict Python syntax
        run: python -m py_compile tools/owner_encrypted_recovery_drill.py tests/test_owner_encrypted_recovery_drill.py
