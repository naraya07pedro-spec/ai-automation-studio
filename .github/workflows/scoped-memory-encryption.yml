name: Scoped Agent memory encrypted-at-rest acceptance

on:
  pull_request:
    paths:
      - 'app/local_scoped_agent_memory.py'
      - 'app/local_scoped_memory_crypto.py'
      - 'app/migrate_scoped_memory_encryption.py'
      - 'app/local_service_credentials.py'
      - 'app/local_server.py'
      - 'tests/test_scoped_memory_encryption.py'
      - 'tests/test_scoped_memory_retention_purge.py'
      - 'requirements-vault.txt'
      - '.github/workflows/scoped-memory-encryption.yml'
  push:
    branches: [main]
    paths:
      - 'app/local_scoped_agent_memory.py'
      - 'app/local_scoped_memory_crypto.py'
      - 'app/migrate_scoped_memory_encryption.py'
      - 'app/local_service_credentials.py'
      - 'app/local_server.py'
      - 'tests/test_scoped_memory_encryption.py'
      - '.github/workflows/scoped-memory-encryption.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aesgcm-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned vetted PyCA encryption dependency
        run: python -m pip install -r requirements-vault.txt
      - name: Compile edited code and encrypted tests
        run: |
          python -m py_compile app/local_scoped_memory_crypto.py app/local_scoped_agent_memory.py app/migrate_scoped_memory_encryption.py app/local_server.py app/launch_workbench.py tests/test_scoped_memory_encryption.py
      - name: Test AESGCM, owner-controlled offline migration and tamper rejection
        run: python -m unittest discover -s tests -p 'test_scoped_memory_encryption.py' -v
      - name: Verify expired note redaction, owner-only purging and encrypted expiration
        run: python -m unittest discover -s tests -p 'test_scoped_memory_retention_purge.py' -v
      - name: Check legacy Agent memory / plan binding compatibility
        run: |
          python -m unittest discover -s tests -p 'test_scoped_agent_memory.py' -v
          python -m unittest discover -s tests -p 'test_agent_profiles.py' -v
          python -m unittest discover -s tests -p 'test_launch_workbench.py' -v
