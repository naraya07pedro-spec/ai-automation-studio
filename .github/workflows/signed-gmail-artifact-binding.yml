name: Stage 121 signed downstream Gmail artifact identity binding

on:
  pull_request:
    paths:
      - 'app/local_signed_gmail_artifact.py'
      - 'app/local_gmail_sent_evidence.py'
      - 'app/local_server.py'
      - 'app/local_security_audit.py'
      - 'tests/test_signed_gmail_artifact.py'
      - 'docs/SIGNED_GMAIL_ARTIFACT_BINDING_V1.md'
      - '.github/workflows/signed-gmail-artifact-binding.yml'
  push:
    branches: [main]
    paths:
      - 'app/local_signed_gmail_artifact.py'
      - 'app/local_gmail_sent_evidence.py'
      - 'app/local_server.py'
      - 'app/local_security_audit.py'
      - 'tests/test_signed_gmail_artifact.py'
      - 'docs/SIGNED_GMAIL_ARTIFACT_BINDING_V1.md'
      - '.github/workflows/signed-gmail-artifact-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-artifact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned crypto dependency
        run: python -m pip install -r requirements-vault.txt
      - name: Test exact Stage 116-121 encrypted signed and provider correlation
        run: python -m unittest discover -s tests -p 'test_signed_gmail_artifact.py' -v
      - name: Verify predecessor n8n and Gmail regressions
        run: |
          python -m unittest discover -s tests -p 'test_signed_manual_handoff_outcome.py' -v
          python -m unittest discover -s tests -p 'test_n8n_execution_verifier.py' -v
          python -m unittest discover -s tests -p 'test_gmail_sent_evidence.py' -v
      - name: Strict Python syntax
        run: python -m py_compile app/local_signed_gmail_artifact.py app/local_gmail_sent_evidence.py app/local_server.py app/local_security_audit.py tests/test_signed_gmail_artifact.py
